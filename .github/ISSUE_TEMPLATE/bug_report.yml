name: Bug Report
description: Report a bug in Undisk MCP
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CLI (@undisk-mcp/cli)
        - stdio-proxy (@undisk-mcp/stdio-proxy)
        - MCP API (hosted server)
        - Docker image
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "CLI version, or 'hosted' for the API"
      placeholder: "0.1.1"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
  - type: dropdown
    id: client
    attributes:
      label: MCP Client
      options:
        - Claude Desktop
        - Cursor
        - VS Code (Copilot)
        - Docker MCP Hub
        - Custom / Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, OS, Node.js version, etc.
